name: Evaluate Predictions

# Vercel Hobby plan cron job'ları günde 1 kere ile sınırlı (vercel.json'daki
# günlük fallback yeterli değil) — bitmiş maçların tahminlerini yakın zamanda
# değerlendirmek için asıl mekanizma bu workflow.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Grup adı 2026-10-03'te değişti: eski `evaluate-predictions` grubunun kilidi GitHub tarafında takılı kaldı —
# 2026-09-10'dan beri hiçbir zamanlanmış çalışma oluşmadı, elle tetiklenen çalışma "henüz kuyruğa alınmamış"
# durumda bekledi (0 job; iptal/zorla iptal reddedildi). Yeni ad temiz bir kilitle başlar.
concurrency:
  group: evaluate-predictions-cron
  cancel-in-progress: false

jobs:
  evaluate:
    name: Trigger evaluate-predictions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call evaluate-predictions endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://ofsayt-yok.vercel.app/api/admin/evaluate-predictions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          # 202 = kabul edildi (iş arka planda), 409 = başka tetikleyici (cron-job.org) zaten çalıştırıyor.
          if [ "$status" -ge 300 ] && [ "$status" != "409" ]; then
            echo "evaluate-predictions failed with status $status"
            exit 1
          fi

  # Popüler maçların AI analizi maçtan ~3 saat önce (bkz. src/server/analysisPregen.ts). Ayrı iş: biri
  # başarısız olursa diğeri etkilenmez. Çağrı başına en fazla 3 üretim (~15 sn/maç), uç 120 sn ile sınırlı.
  analysis-pregenerate:
    name: Pre-generate match analyses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call analysis-pregenerate endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 150 \
            -X POST "https://ofsayt-yok.vercel.app/api/admin/analysis-pregenerate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          # 202 = kabul edildi (iş arka planda), 409 = başka tetikleyici (cron-job.org) zaten çalıştırıyor.
          if [ "$status" -ge 300 ] && [ "$status" != "409" ]; then
            echo "analysis-pregenerate failed with status $status"
            exit 1
          fi
