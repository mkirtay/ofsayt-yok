<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maç oynanıyor — Ofsayt Yok animasyon referansı</title>
<style>

body { margin: 0; }
.stripes { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.06) 24px, transparent 24px, transparent 48px); }
.turf { position: relative; width: 504px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #007B55 0%, #00a76f 60%, #007B55 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.home { background: #ffffff; box-shadow: 0 0 0 2px #007B55, 0 2px 4px rgba(0,0,0,.25); }
.away { background: #007B55; box-shadow: 0 0 0 2px #ffffff, 0 2px 4px rgba(0,0,0,.25); }
.ballw { position: absolute; display: block; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; box-shadow: inset -2px -2px 0 rgba(0,0,0,.12), 0 3px 6px rgba(0,0,0,.3); }
.ballw::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.55) 0deg 30deg, transparent 30deg 150deg, rgba(0,0,0,.55) 150deg 180deg, transparent 180deg 300deg, rgba(0,0,0,.55) 300deg 330deg, transparent 330deg 360deg); opacity: .6; }
.cline { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.32); }
.ccircle { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid rgba(255,255,255,.32); border-radius: 50%; box-sizing: border-box; }
.box { position: absolute; top: 50%; width: 66px; height: 132px; margin-top: -66px; border: 2px solid rgba(255,255,255,.32); box-sizing: border-box; }
.boxL { left: 0; border-left: none; }
.boxR { right: 0; border-right: none; }
.gpost { position: absolute; top: 50%; width: 12px; height: 48px; margin-top: -24px; border: 3px solid rgba(255,255,255,.9); box-sizing: border-box; }
.gpostL { left: 3px; border-right: none; border-radius: 3px 0 0 3px; }
.gpostR { right: 3px; border-left: none; border-radius: 0 3px 3px 0; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}


.pitch { height: 120px; animation: pitchPulse 2s ease-in-out infinite; }
@keyframes pitchPulse {
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 0 0 rgba(0,167,111,.35); }
  50% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 14px 5px rgba(0,167,111,.35); }
}
.goal { position: absolute; top: 50%; width: 22px; height: 64px; margin-top: -32px; border: 3px solid rgba(255,255,255,.9); box-sizing: border-box; }
.goalL { left: 8px; border-right: none; border-radius: 4px 0 0 4px; }
.goalR { right: 8px; border-left: none; border-radius: 0 4px 4px 0; }
.net { position: absolute; inset: 2px; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0, rgba(255,255,255,.35) 1px, transparent 1px, transparent 6px), repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0, rgba(255,255,255,.35) 1px, transparent 1px, transparent 6px); }
.flash { position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%); opacity: 0; }
.flashR { animation: flashR 4s ease-in-out infinite; }
.flashL { animation: flashL 4s ease-in-out infinite; }
@keyframes flashR {
  0%, 29%, 41%, 100% { opacity: 0; transform: scale(.8); }
  33% { opacity: 1; transform: scale(1.3); }
  37% { opacity: 0; transform: scale(1); }
}
@keyframes flashL {
  0%, 69%, 81%, 100% { opacity: 0; transform: scale(.8); }
  73% { opacity: 1; transform: scale(1.3); }
  77% { opacity: 0; transform: scale(1); }
}
.team { position: absolute; top: 50%; margin-top: -8px; display: flex; gap: 16px; }
.teamL { left: 46px; }
.teamR { right: 46px; }
.p { display: block; width: 16px; height: 16px; border-radius: 50%; animation: bob 1.1s ease-in-out infinite alternate; }
@keyframes bob {
  0% { transform: translateY(0); }
  100% { transform: translateY(-4px); }
}
.mover { top: 50%; left: 50%; margin: -9px 0 0 -9px; animation: ballPath 4s ease-in-out infinite; }
.glow { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 72%); animation: ballPath 4s ease-in-out infinite; }
@keyframes ballPath {
  0% { left: 50%; top: 50%; transform: rotate(0deg) scale(1); }
  10% { left: 50%; top: 50%; transform: rotate(60deg) scale(1); }
  22% { left: 80%; top: 32%; transform: rotate(280deg) scale(1); }
  30% { left: 92%; top: 50%; transform: rotate(420deg) scale(1); }
  34% { left: 95%; top: 50%; transform: rotate(460deg) scale(.7); }
  40% { left: 50%; top: 50%; transform: rotate(560deg) scale(1); }
  50% { left: 50%; top: 50%; transform: rotate(620deg) scale(1); }
  62% { left: 20%; top: 32%; transform: rotate(840deg) scale(1); }
  70% { left: 8%; top: 50%; transform: rotate(980deg) scale(1); }
  74% { left: 5%; top: 50%; transform: rotate(1020deg) scale(.7); }
  80% { left: 50%; top: 50%; transform: rotate(1120deg) scale(1); }
  100% { left: 50%; top: 50%; transform: rotate(1160deg) scale(1); }
}
.track { position: relative; width: 504px; height: 6px; border-radius: 999px; background: #e6ede9; overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #00a76f, #007B55); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

.demo { font-family: Inter, system-ui, sans-serif; color: #101512; padding: 32px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.demo h1 { margin: 0; font-size: 22px; font-weight: 800; }
.demo p { margin: 0 0 6px; font-size: 14px; color: #44544b; }
</style>
</head>
<body>
<div class="demo">
<h1>Maç oynanıyor</h1>
<p>Nerede: AI Analiz bekleme ekranı (bugün kullanılıyor).</p>
<div class="turf pitch">
<span class="stripes"></span>
<div class="goal goalL"><span class="net"></span><span class="flash flashL"></span></div>
<div class="team teamL"><span class="p home" style="animation-delay: 0s"></span><span class="p home" style="animation-delay: 0.35s"></span></div>
<span class="glow"></span>
<span class="ballw mover"></span>
<div class="team teamR"><span class="p away" style="animation-delay: 0.15s"></span><span class="p away" style="animation-delay: 0.5s"></span></div>
<div class="goal goalR"><span class="net"></span><span class="flash flashR"></span></div>
</div>
<div class="track"><span class="fill"></span></div>
</div>
</body>
</html>
