<title>Diziliş kuruluyor — Ofsayt Yok animasyon referansı</title>
<style>

body { margin: 0; }
.stripes { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.06) 24px, transparent 24px, transparent 48px); }
.turf { position: relative; width: 504px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #007B55 0%, #00a76f 60%, #007B55 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.home { background: #ffffff; box-shadow: 0 0 0 2px #007B55, 0 2px 4px rgba(0,0,0,.25); }
.away { background: #007B55; box-shadow: 0 0 0 2px #ffffff, 0 2px 4px rgba(0,0,0,.25); }
.ballw { position: absolute; display: block; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; box-shadow: inset -2px -2px 0 rgba(0,0,0,.12), 0 3px 6px rgba(0,0,0,.3); }
.ballw::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.55) 0deg 30deg, transparent 30deg 150deg, rgba(0,0,0,.55) 150deg 180deg, transparent 180deg 300deg, rgba(0,0,0,.55) 300deg 330deg, transparent 330deg 360deg); opacity: .6; }
.cline { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.32); }
.ccircle { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid rgba(255,255,255,.32); border-radius: 50%; box-sizing: border-box; }
.box { position: absolute; top: 50%; width: 66px; height: 132px; margin-top: -66px; border: 2px solid rgba(255,255,255,.32); box-sizing: border-box; }
.boxL { left: 0; border-left: none; }
.boxR { right: 0; border-right: none; }
.gpost { position: absolute; top: 50%; width: 12px; height: 48px; margin-top: -24px; border: 3px solid rgba(255,255,255,.9); box-sizing: border-box; }
.gpostL { left: 3px; border-right: none; border-radius: 3px 0 0 3px; }
.gpostR { right: 3px; border-left: none; border-radius: 0 3px 3px 0; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}


.fpitch { height: 230px; }
.dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; }
.chip { position: absolute; top: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.28); color: #ffffff; font-weight: 800; font-size: 13px; letter-spacing: .04em; animation: chip 5s ease-in-out infinite both; }
.chipL { left: 12px; }
.chipR { right: 12px; animation-delay: .3s; }
@keyframes chip {
  0%, 34% { opacity: 0; transform: translateY(-4px); }
  42%, 78% { opacity: 1; transform: translateY(0); }
  86%, 100% { opacity: 0; transform: translateY(-4px); }
}
.cball { left: 50%; top: 50%; margin: -9px 0 0 -9px; animation: breathe 1.6s ease-in-out infinite alternate; }
@keyframes breathe {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}
.d0 { transform: translate(-222px, 0px); animation: k0 5s cubic-bezier(.3,.7,.3,1) 0.00s infinite both; }

  0% { transform: translate(0px, 0px) scale(.3); opacity: 0; }
  10% { transform: translate(0px, 0px) scale(1); opacity: 1; }
  36%, 80% { transform: translate(-222px, 0px) scale(1); opacity: 1; }
  94% { transform: translate(0px, 0px) scale(.7); opacity: 1; }
  100% { transform: translate(0px, 0px) scale(.3); opacity: 0; }
}
