<script>
(function () {
  var facts = [{"title": "Ofsayt nedir?", "body": "Takım arkadaşı topa oynadığı anda rakip yarı sahada olan ve hem toptan hem de sondan ikinci rakip oyuncudan rakip kale çizgisine daha yakın duran oyuncu ofsayt pozisyonundadır. Bu pozisyonda olmak tek başına ihlal değildir; oyuncu oyuna müdahale eder, rakibini engeller ya da bu konumdan avantaj sağlarsa ofsayt çalınır.", "note": "Rakiple aynı hizada olmak ofsayt değildir. Taç, korner ve kale vuruşundan doğrudan ofsayt olmaz.", "anim": "var"}, {"title": "Kalecinin 8 saniyesi", "body": "2025-26 sezonundan itibaren kaleci topu elinde 8 saniyeden uzun tutarsa rakip takıma korner verilir. Hakem son 5 saniyeyi eliyle sayarak kaleciyi uyarır.", "note": "Eskiden bu süre 6 saniyeydi ve ihlalin cezası endirekt serbest vuruştu.", "anim": "ring"}, {"title": "Avantaj kuralı", "body": "Faule uğrayan takım bundan fayda sağlayacaksa hakem oyunu durdurmaz ve avantaj verir. Beklenen fayda birkaç saniye içinde gerçekleşmezse hakem geri dönüp ilk faulü cezalandırabilir.", "note": "Kart gerektiren bir faulde avantaj verilse bile kart, oyun durduğunda yine gösterilir.", "anim": "match"}, {"title": "Kaç kişi kalırsa maç biter?", "body": "Bir takım 7'den az oyuncuyla maça başlayamaz ve devam edemez. Kırmızı kartlar ya da sakatlıklar yüzünden sahadaki oyuncu sayısı 7'nin altına düşerse hakem maçı tatil eder.", "note": "", "anim": "formation"}];
  var idx = 0;
  var q = function (s) { return document.querySelector(s); };
  var drawer = q('.kk-drawer'), backdrop = q('.kk-backdrop'), launcher = q('.kk-launcher');
  function fit() { var st = q('.kk-stage'); st.style.setProperty('--s', String(st.clientWidth / 504)); }
  function render() {
    var f = facts[idx];
    q('#kk-title').textContent = f.title;
    q('#kk-text').textContent = f.body;
    q('#kk-note').hidden = !f.note;
    q('#kk-note-text').textContent = f.note;
    document.querySelectorAll('[data-anim]').forEach(function (el) { el.hidden = el.getAttribute('data-anim') !== f.anim; });
    q('#kk-counter').textContent = 'Futbolun kuralları · ' + (idx + 1) + ' / ' + facts.length;
    document.querySelectorAll('.dot2').forEach(function (d, i) { d.classList.toggle('dot2On', i === idx); });
    fit();
  }
  function open() {
    drawer.classList.add('kk-drawerOpen');
    backdrop.classList.add('kk-backdropOpen');
    q('.kk-peek').hidden = true;
    q('.kk-new').hidden = true;
    render();
    q('.kk-close').focus();
  }
  function close() {
    drawer.classList.remove('kk-drawerOpen');
    backdrop.classList.remove('kk-backdropOpen');
    launcher.focus();
  }
  launcher.addEventListener('click', open);
  q('.kk-peek').addEventListener('click', open);
  q('.kk-close').addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer.classList.contains('kk-drawerOpen')) close(); });
  q('#kk-next').addEventListener('click', function () { idx = (idx + 1) % facts.length; render(); });
  q('#kk-prev').addEventListener('click', function () { idx = (idx + facts.length - 1) % facts.length; render(); });
  window.addEventListener('resize', fit);
  // Referans için baloncuk 2 sn sonra görünür ve 6 sn kalır; sitede kurallar README'de.
  setTimeout(function () { var p = q('.kk-peek'); p.hidden = false; setTimeout(function () { p.hidden = true; }, 6000); }, 2000);
})();
</script>
